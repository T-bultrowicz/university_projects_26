<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Contact Me!</title>
</head>
<body>
    <header>
        <!-- TODO: Add a <nav> with an unordered list <ul> of 3 links:
             Home (index.html), Projects (projects.html), Contact (contact.html) -->
        <nav>
            <ul>
                <li> <a href="/index.html"> Home </a> </li>
                <li> <a href="/projects.html"> Projects </a> </li>
                <li> <a href="/contact.html"> Contact </a> </li>
            </ul>
        </nav>
    </header>

    <h1>Contact Me</h1>
    <form action="/submit" method="POST">
        <fieldset id="userQuery">
            <legend>Your Details</legend>

            <div class="form-group">
                <label for="name">Put your name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Put your email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message me!</label>
                <textarea id="message" name="message" rows="5">Hi!</textarea>
            </div>

            <div class="form-group">
                <label for="option">What is msg about?</label>
                <select id="option" name="option">
                    <option value="">-- Please choose --</option>
                    <option value="General" selected>General</option>
                    <option value="Bug Report">Bug Report</option>
                    <option value="Feature Request">Feature Request</option>
                    <option value="I will hire you">I will hire you</option>
                </select>
            </div>
        </fieldset>

        <div class="button-group">
            <button type="submit"> Send </button>
            <button type="reset">   Clear </button>
        </div>
    </form>
</body>
</html>
